- aid: drata:mcp
  name: Drata MCP Server
  description: >-
    Drata's hosted remote Model Context Protocol server (Beta). MCP-compatible clients (Claude, ChatGPT,
    Cursor, Microsoft Copilot) connect over OAuth 2.1 with PKCE to regional endpoints for the US, EU and
    APAC, and read live compliance data — controls, policies, monitoring tests, risks, risk registers,
    workspaces and assigned policies — bounded by the intersection of the granted OAuth scopes and the
    user's Drata role.
