apis:
- aid: drata:public-api-v2
  name: Drata Public API v2
  description: Drata's Public REST API v2 — 197 operations across 132 paths covering assets, audits, audit requests,
    background checks, company, control library, controls, control notes/owners, custom connections, custom data
    records, custom field definitions, devices and device documents, events, evidence and the evidence library,
    frameworks, groups, HRIS user identities, monitoring tests, personnel, policies and policy languages, risks,
    risk registers, risk library, risk notes and documents, tasks, uploads, user documents, user-assigned policies,
    users and roles, vendors, vendor documents, vendor security reviews, vendor types, and workspaces. Bearer API-key
    auth, cursor pagination, and an `expand[]` query parameter for related objects. Regional bases exist for US,
    EU and APAC.
  humanURL: https://developers.drata.com/openapi/reference/v2/overview/
  baseURL: https://public-api.drata.com/public/v2
  tags:
  - GRC
  - Compliance
  - REST
