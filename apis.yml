- aid: drata:safebase-trust-api
  name: SafeBase Trust API
  description: SafeBase Trust API — 41 operations for trust centers, security questionnaires, NDA settings, document
    libraries, knowledge-base entries, access requests and trust-center updates. SafeBase was acquired by Drata
    in 2024 and the API remains published on the safebase.io domain; the spec declares servers https://app.safebase.io/api/ext/v1/rest
    and contact support@safebase.io. Authenticated with an `x-sb-api-key` header.
  humanURL: https://docs.safebase.io/reference/getaccounts
  baseURL: https://app.safebase.io/api/ext/v1/rest
  tags:
  - Trust Center
  - Questionnaires
  - Security
  properties:
  - type: OpenAPI
    url: openapi/drata-safebase-trust-api-openapi.yml
  - type: Documentation
    url: https://docs.safebase.io/reference/getaccounts
  - type: APIReference
    url: https://docs.safebase.io/reference/getaccounts
- aid: drata:mcp
  name: Drata MCP Server
  description: Drata's hosted remote Model Context Protocol server (Beta). MCP-compatible clients (Claude, ChatGPT,
    Cursor, Microsoft Copilot) connect over OAuth 2.1 with PKCE to regional endpoints for the US, EU and APAC, and
    read live compliance data — controls, policies, monitoring tests, risks, risk registers, workspaces and assigned
    policies — bounded by the intersection of the granted OAuth scopes and the user's Drata role.
  humanURL: https://developers.drata.com/developer-portal/v2/recipes/mcp-oauth-setup/
  tags:
