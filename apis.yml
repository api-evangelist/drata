    records keyed by your own `identityId`, then use the update endpoint to reflect employment changes
    (e.g. set `separatedAt` when an employee leaves). Deleting a record is intended for data submitted
    in error, not for offboarding. Changes are not applied immediately — they are incorporated the next
    time identity sync runs, which happens nightly by default. A sync can also be triggered manually from
