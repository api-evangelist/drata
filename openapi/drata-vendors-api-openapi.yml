    VendorStatsResponsePublicV2Dto:
      type: object
      properties:
        reminder:
          example:
          - key: RENEWAL_DUE
            count: 1
          - key: RENEWAL_DUE_SOON
            count: 1
          description: Renewal reminder statistics for active vendors. Shows distribution of vendors by renewal status (due soon, overdue, etc.). Only returned when expand[]=reminder is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorReminderStatsItemPublicV2Dto'
        hasPii:
          example:
          - key: true
            count: 1
          - key: false
            count: 1
          description: PII (Personally Identifiable Information) statistics. Shows how many vendors contain PII, which is important for data privacy compliance. Only returned when expand[]=hasPii is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorHasPiiStatsItemPublicV2Dto'
        businessUnits:
          example:
          - key: ENGINEERING
            count: 118
          - key: PRODUCT
            count: 2
          description: Business unit/department distribution statistics. Shows which teams or departments use which vendors. Includes percentage of total for easy analysis. Only returned when expand[]=businessUnits is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorBusinessUnitStatsItemPublicV2Dto'
        passwordPolicy:
          example:
          - key: USERNAME_PASSWORD
            count: 118
          - key: SSO
            count: 32
          description: Authentication method statistics. Shows how many vendors use SSO vs traditional passwords. SSO adoption percentage helps track security posture improvements. Only returned when expand[]=passwordPolicy is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorPasswordPolicyStatsItemPublicV2Dto'
        status:
          example:
          - key: ACTIVE
            count: 118
          - key: UNDER_REVIEW
            count: 20
          description: Vendor status distribution statistics. Shows lifecycle stage of vendors (active, archived, under review, etc.). Percentages help identify status trends. Only returned when expand[]=status is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorStatusStatsItemPublicV2Dto'
        isCritical:
          example:
          - key: 'Yes'
            count: 10
          - key: 'No'
            count: 20
          description: Vendor criticality statistics. Shows how many vendors are mission-critical to business operations. Critical vendors require enhanced monitoring and SLAs. Only returned when expand[]=isCritical is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorIsCriticalStatsItemPublicV2Dto'
        isSubProcessor:
          example:
          - key: true
            count: 10
          - key: false
            count: 20
          description: Sub-processor statistics. Shows how many vendors process data on your behalf, which is critical for GDPR/CCPA compliance. Sub-processors require DPAs and additional documentation. Only returned when expand[]=isSubProcessor is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorIsSubProcessorStatsItemPublicV2Dto'
        type:
          example:
          - key: CONTRACTOR
            count: 15
          - key: VENDOR
            count: 45
          description: Vendor type classification statistics. Shows distribution across vendor, supplier, contractor, partner categories. Helps with vendor segmentation and management strategies. Only returned when expand[]=type is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorTypeStatsItemPublicV2Dto'
        risk:
          example:
          - key: HIGH
            count: 15
          - key: MODERATE
            count: 50
          - key: LOW
            count: 45
          - key: NONE
            count: 10
          description: Vendor risk level distribution statistics. Shows security and compliance risk assessment across all vendors. Use percentages to track risk reduction over time. Only returned when expand[]=risk is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorRiskStatsItemPublicV2Dto'
        impactLevel:
          example:
          - key: CRITICAL
            count: 7
          - key: MAJOR
            count: 12
          - key: UNSCORED
            count: 0
          description: Business impact level statistics. Shows potential business disruption if vendors become unavailable. Critical/Major vendors need business continuity plans. Only returned when expand[]=impactLevel is passed.
          type: array
          items:
            $ref: '#/components/schemas/VendorImpactLevelStatsItemPublicV2Dto'
