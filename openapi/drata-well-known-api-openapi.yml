  /.well-known/oauth-protected-resource:
    get:
      summary: Oauth Protected Resource
      description: 'OAuth Protected Resource metadata endpoint.


        This is the primary discovery endpoint that MCP clients (like mcp-remote) use

        to discover OAuth requirements. It points clients to our Auth0 proxy as the

        authorization server.


        See: RFC 9728 (OAuth 2.0 Protected Resource Metadata)'
      operationId: oauth_protected_resource__well_known_oauth_protected_resource_get
      responses:
        '200':
          description: Successful Response
