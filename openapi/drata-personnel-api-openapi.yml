          description: 'Bucket counts for the device-rollup auto-updates compliance check (worst-of-N across the personnel''s devices). ⚠️ Coverage limitation: personnel without applicable device compliance data are absent from every bucket. This includes out-of-scope employment statuses, personnel with no devices, and personnel whose only device has an unknown management source. The sum of bucket counts may be less than `pagination.totalCount`. The `OUT_OF_SCOPE` bucket is always 0 for this facet.'
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
