      - id
      - name
      - connectionProvider
    PersonnelSearchFacetsResponsePublicV2Dto:
      type: object
      properties:
        employmentStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        complianceStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        syncStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        groupIds:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        acceptedPoliciesStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        bgCheckStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        identityMfaStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        securityTrainingStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        hipaaTrainingStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        aiAwarenessTrainingStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        offboardingStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        agentInstalledStatus:
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        passwordManagerStatus:
          description: 'Bucket counts for the device-rollup password-manager compliance check (worst-of-N across the personnel''s devices). ⚠️ Coverage limitation: personnel without applicable device compliance data are absent from every bucket. This includes out-of-scope employment statuses, personnel with no devices, and personnel whose only device has an unknown management source. The sum of bucket counts may be less than `pagination.totalCount`. The `OUT_OF_SCOPE` bucket is always 0 for this facet.'
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        diskEncryptionStatus:
          description: 'Bucket counts for the device-rollup disk-encryption compliance check (worst-of-N across the personnel''s devices). ⚠️ Coverage limitation: personnel without applicable device compliance data are absent from every bucket. This includes out-of-scope employment statuses, personnel with no devices, and personnel whose only device has an unknown management source. The sum of bucket counts may be less than `pagination.totalCount`. The `OUT_OF_SCOPE` bucket is always 0 for this facet.'
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
        antivirusStatus:
          description: 'Bucket counts for the device-rollup antivirus compliance check (worst-of-N across the personnel''s devices). ⚠️ Coverage limitation: personnel without applicable device compliance data are absent from every bucket. This includes out-of-scope employment statuses, personnel with no devices, and personnel whose only device has an unknown management source. The sum of bucket counts may be less than `pagination.totalCount`. The `OUT_OF_SCOPE` bucket is always 0 for this facet.'
          type: array
          items:
            $ref: '#/components/schemas/FacetBucketResponsePublicV2Dto'
