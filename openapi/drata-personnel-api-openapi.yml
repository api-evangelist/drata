    PersonSearchResponsePublicV2Dto:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: Personnel ID
        userId:
          type: number
          example: 1
          description: User ID associated with this Personnel
        user:
          description: The User associated with this Personnel, only returned when `expand[]=user` is passed.
          allOf:
          - $ref: '#/components/schemas/UserCompactResponsePublicV2Dto'
        employmentStatus:
          description: The employment status of the Personnel
          allOf:
          - $ref: '#/components/schemas/EmploymentStatusEnum'
        notHumanReason:
          type:
          - string
          - 'null'
          example: This is not a real personnel, but a placeholder for anyone in charge of X
          description: Indicates why the employment status of this Personnel is marked as `OUT_OF_SCOPE`.
        reasonProvider:
          description: The User who marked the employment status as `OUT_OF_SCOPE` and provided the `notHumanReason`, only returned when `expand[]=reasonProvider` is passed.
          allOf:
          - $ref: '#/components/schemas/UserCompactResponsePublicV2Dto'
        syncStatus:
          example: SYNCED
          description: Binary identity-connection status. `SYNCED` means the Personnel has at least one HRIS or IDP connection; `NOT_SYNCED` means none. Mirrors the binary surface of the private `PersonnelSyncStatus` enum.
          allOf:
          - $ref: '#/components/schemas/PersonnelSyncStatusPublicV2Enum'
        idpConnectionId:
          type:
          - number
          - 'null'
          example: 1
          description: ID of the IDP Connection this Personnel was synced from. `null` if the Personnel has no IDP source.
        hrisConnectionId:
          type:
          - number
          - 'null'
          example: 2
          description: ID of the HRIS Connection this Personnel was synced from. `null` if the Personnel has no HRIS source.
        startedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
          description: The date when this Personnel was onboarded onto the company system
        separatedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2023-12-31T00:00:00.000Z'
          description: The date when this Personnel was separated from the company system
        statusUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The date when this Personnel was manually updated. If this value is set, changes in the IDP or HRIS will not be reflected in the employment status.
        createdAt:
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
          description: Personnel created date timestamp
        updatedAt:
          type: string
          format: date-time
          example: '2023-01-01T00:00:00.000Z'
          description: Personnel updated date timestamp
        complianceChecks:
          description: Compliance checks for this Personnel with pagination metadata. Only returned when `expand[]=complianceChecks` is passed.
          allOf:
          - $ref: '#/components/schemas/PersonnelComplianceChecksSubcollectionPublicV2Dto'
        customFields:
          description: Custom field submissions for this Personnel with pagination metadata. Only returned when `expand[]=customFields` is passed.
          allOf:
          - $ref: '#/components/schemas/PersonnelCustomFieldsSubcollectionPublicV2Dto'
        groups:
          description: Groups this Personnel belongs to with pagination metadata. Only returned when `expand[]=groups` is passed.
          allOf:
          - $ref: '#/components/schemas/PersonnelGroupsSubcollectionPublicV2Dto'
        idpConnection:
          description: The IDP Connection this Personnel was synced from. Only returned when `expand[]=idpConnection` is passed.
          allOf:
          - $ref: '#/components/schemas/ConnectionCompactResponsePublicV2Dto'
        hrisConnection:
          description: The HRIS Connection this Personnel was synced from. Only returned when `expand[]=hrisConnection` is passed.
          allOf:
          - $ref: '#/components/schemas/ConnectionCompactResponsePublicV2Dto'
      required:
      - id
      - userId
      - employmentStatus
      - syncStatus
      - idpConnectionId
      - hrisConnectionId
      - startedAt
