components:
  schemas:
    ScopedPersonnelGroupItemResponsePublicV2Dto:
      type: object
      properties:
        id:
          type: number
          example: 42
          description: Group ID
        name:
          type: string
          example: IT Ops
          description: Group name
        connectionProvider:
          type:
          - string
          - 'null'
          example: GOOGLE
          description: Vendor ClientType name (e.g. "GOOGLE", "OKTA_IDENTITY") of the group's source connection. Null when the group has no resolvable connection.
