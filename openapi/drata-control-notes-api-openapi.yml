    delete:
      description: 'Delete a Note for a given Control.


        🔒 Requires **Controls: Delete Control Note** permission.'
      operationId: ControlNotesPublicV2Controller_deleteNote
      parameters:
      - name: workspaceId
        required: true
        in: path
        description: The Workspace ID associated to the Account
        schema:
          type: number
      - name: controlId
        required: true
        in: path
        schema:
          type: number
      - name: noteId
        required: true
        in: path
