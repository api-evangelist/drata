                        - listEntries:
                          - company:
                              logo: https://logo.clearbit.com/safebase.io
                              name: SafeBase
                              domain: safebase.io
                            createdAt: '2022-08-15T13:40:54.458Z'
                          - company:
                              logo: https://logo.clearbit.com/amazon.com
                              name: Amazon
                              domain: amazon.com
                            createdAt: '2022-08-15T13:40:54.458Z'
                          id: e3fae2ca-94a9-416b-b577-5c90e382df57
                          title: Subprocessors
                          cardType: legal
                        - explanation: We are working on our SOC 2
                          id: f4951085-df2e-4fac-9d43-60b796478b2e
