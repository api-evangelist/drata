                          cardType: security_grades
                        - maturity: in_progress
                          recurrence: months_6
                          id: 382f924d-54f3-43a8-a9df-c39e6c959958
                          title: Security Whitepaper
                          cardType: reports
                        - explanation: 'We

                            have

                            really

                            very

                            good

                            security


                            Your security is our #1 priority and we take it seriously. At our company, we handle critical financial data of your business. These include information about your processes, revenue, payment gateway information and merchant information. During these processes, we know the security of our system should be air-tight to provide you with a hassle-free experience. Our teams take preventive measures, adheres and keep up with the latest security and compliance practices across the globe.'
                          id: 4f5e1d9d-df3a-4fe4-9642-30ecbd6de704
                          title: Body
                          cardType: overview
                        - href: https://drata.com/privacy
                          id: 63f59def-eb18-4135-95a1-addeb7463801
