openapi: 3.2.0
info:
  description: SafeBase API documentation.
  version: 1.4.1
  title: SafeBase API documentation Portals API
  contact:
    email: support@safebase.io
servers:
- url: https://app.safebase.io/api/ext/v1/rest
security:
- apiKey: []
tags:
- name: Portals
paths:
  /portals/default/products:
    get:
      tags:
      - Portals
      summary: Get All Products
      description: Gets all the products that make up a given portal. This endpoint will default to only pulling in the data that has been made public
      operationId: getPortal
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  result:
                    allOf:
                    - type: object
                      properties:
                        id:
                          type: string
                          example: default
                          description: The ID of the product
                        name:
                          type: string
                          example: default
                          description: The name of the product
                        show:
                          type: boolean
                          example: true
                          description: Shows whether the product is visible in the portal or not
                    - type: object
                      properties:
                        cards:
                          type: object
                          description: Object that contains data on the meta data of a specific card
                          properties:
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  cardType:
                                    type: string
                                    description: The type of card that data is grouped under
                                  title:
                                    type: string
                                    description: The display text for that card type
                              description: List of cards
                            count:
                              type: number
                              description: Number of cards in the list
                        data:
                          type: object
                          description: Data about the specfic items that make up the product
                          properties:
                            items:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                    description: The unique id corresponding to that piece of data
                                  explanation:
                                    type: string
                                    description: Text describing the data item
                                  maturity:
                                    type: string
                                    description: Field to communicate if the state of the items
                                    enum:
                                    - na
                                    - in_progress
                                    - full
                                  href:
                                    type: string
                                    format: url
                                    description: A link out to an external resource if necessary
                                  choice:
                                    type: string
                                    description: A string for risk profile items to communicate out the risk
                                    enum:
                                    - public
                                    - internal
                                    - restricted
                                    - low
                                    - moderate
                                    - substantial
                                    - severe
                                    - 'yes'
                                    - 'no'
                                    - hours_12
                                    - hours_24
                                    - hours_24_48
                                    - hours_48_72
                                    - days_4_7
                                    - days_8
                                    - major_cloud
                                    - on_premise
                                    - combination
                                  recurrence:
                                    type: string
                                    description: How often the these are review/assessed
                                    enum:
                                    - na
                                    - months_3
                                    - months_6
                                    - years_1
                                  publicAccess:
                                    type: boolean
                                  cardType:
                                    type: string
                                    description: The cardType it is associated with from the cards array
                                  title:
                                    type: string
                                    description: Headline to explain what the data is quickly
                                  listOfEntries:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        logo:
                                          type: string
                                        domain:
                                          type: string
                                        name:
                                          type: string
                                        url:
                                          type: string
                                        grade:
                                          type: string
                                        label:
                                          type: string
                                        description:
                                          type: string
                                    description: Used to communicate out subprocessors and the company they are
                                  hasFiles:
                                    type: boolean
                                  bridgeLetter:
                                    type: object
                              description: List of data that make up the product
                            count:
                              type: number
                              description: Number of data entries
                    example:
                    - id: default
                      name: default
                      show: true
                      cards:
                        items:
                        - cardType: product_features
                          title: Product Security
                        - cardType: security_grades
                          title: Security Grades
                        - cardType: reports
                          title: Reports
                        - cardType: overview
                          title: Overview
                        - cardType: legal
                          title: Legal
                        - cardType: risk_profile
                          title: Risk Profile
                        - cardType: data_security
                          title: Data Security
                        count: 7
                      data:
                        items:
                        - maturity: na
                          explanation: We are working on setting up role based control
                          id: 26715457-a875-4de9-a848-a586aa08e8d9
                          title: Role-Based Access Control
                          cardType: product_features
                        - listEntries:
                          - url: https://www.ssllabs.com/ssltest/analyze.html?d=app.safebase.io
                            grade: A
                            label: API Endpoint
                            description: Great API
                          id: 2a8c3762-0970-4a72-88cd-a86b29f9ef12
