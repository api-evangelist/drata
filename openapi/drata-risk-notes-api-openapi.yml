        🔒 Requires **Risk Management: Delete Risk Note** permission.'
      operationId: RiskNotesPublicV2Controller_deleteRiskNote
      parameters:
      - name: riskRegisterId
        required: true
        in: path
        description: The Risk Register ID
        schema:
