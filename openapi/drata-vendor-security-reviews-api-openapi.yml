      x-product-area:
      - VENDOR_PUBLIC_API
    post:
      description: 'Execute an action on a security review. Finalize marks the review as complete and records the reviewer decision (APPROVED, APPROVED_WITH_CONDITIONS, or REJECTED); decision defaults to APPROVED when omitted. PENDING is not accepted; use Reopen instead if the reviewer needs to return the review to in-progress. Reopen returns a completed review to in-progress and, when `resetDecision` is true, also clears the prior decision back to PENDING. Supported for all security review types (SECURITY, SOC_REPORT, UPLOAD_REPORT).


        🧪 **Note:** This endpoint is in beta and may change.


        🔒 Requires **Vendors: Perform Security Review Action** permission.'
      operationId: VendorSecurityReviewsPublicV2Controller_performSecurityReviewAction
      parameters:
      - name: vendorId
        required: true
        in: path
        schema:
          type: number
      - name: securityReviewId
        required: true
        in: path
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityReviewActionRequestPublicV2Dto'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityReviewActionResultResponsePublicV2Dto'
        '400':
          description: Malformed data and/or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponsePublicV2Dto'
        '401':
          description: Invalid Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '403':
