components:
  schemas:
    VendorSecurityQuestionnairesResponsePublicV2Dto:
      type: object
      properties:
        data:
          description: Data set based on the pagination limits
          type: array
          items:
            $ref: '#/components/schemas/VendorSecurityQuestionnaireResponsePublicV2Dto'
        pagination:
          $ref: '#/components/schemas/PaginationTotalCountResponsePublicV2Dto'
      required:
      - data
      - pagination
    SocReviewFindingsSectionResponsePublicV2Dto:
      type: object
      properties:
        isComplete:
          type: boolean
          description: True when all required fields in this section are populated.
          example: false
        missingRequiredFields:
          description: Dot-notation paths of required fields that are currently missing.
          example:
          - reviewerInformation.reviewer
          type: array
          items:
            type: string
        findings:
          description: List of findings.
          type: array
          items:
            $ref: '#/components/schemas/SocReviewFindingItemResponsePublicV2Dto'
        hasMaterialImpact:
          type:
          - boolean
          - 'null'
          description: Whether the findings have a material impact.
          example: false
      required:
      - isComplete
      - missingRequiredFields
      - findings
      - hasMaterialImpact
    VendorSecurityReviewsResponsePublicV2Dto:
      type: object
      properties:
        data:
          description: Full list of Vendor Security Reviews
          type: array
          items:
            $ref: '#/components/schemas/VendorSecurityReviewResponsePublicV2Dto'
        pagination:
          $ref: '#/components/schemas/PaginationTotalCountResponsePublicV2Dto'
      required:
      - data
      - pagination
    SecurityReviewActionsResponsePublicV2Dto:
      type: object
      properties:
        data:
          description: Available actions for the current security review state.
          type: array
          items:
            $ref: '#/components/schemas/SecurityReviewActionItemResponsePublicV2Dto'
      required:
      - data
    SocReviewReviewerInformationSectionRequestPublicV2Dto:
      type: object
      properties:
        reviewerUserId:
          type:
          - number
          - 'null'
          minimum: 1
          description: User ID of the reviewer.
          example: 42
        reportIssueDate:
          type:
          - string
          - 'null'
          format: date
          description: The date the report was issued. Cannot be a future date.
          example: '2020-07-06'
    VendorSecurityQuestionnaireResponsePublicV2Dto:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: Questionnaire ID
        completedBy:
          type:
          - string
          - 'null'
          example: Acme
          description: Who completed the Questionnaire, null if not completed
        recipientEmail:
          type: string
          maxLength: 191
          format: email
          example: jdoe@company.com
          description: The email address to receive the Questionnaire
        isCompleted:
          type: boolean
          example: 'true'
          description: The status of the Questionnaire
        dateSent:
          type: string
          format: date-time
          example: '2025-07-01T16:45:55.246Z'
          description: Date when the Questionnaire was sent
        isManualUpload:
          type: boolean
          example: 'true'
          description: Flag indicating whether the questionnaire was manually uploaded
        responseId:
          type:
          - number
          - 'null'
          example: 1
          description: The Questionnaire response ID to the Questionnaire data file, null if not completed
        title:
          type: string
          example: Vendor Security Questionnaire
          description: Vendor Questionnaire title
        status:
          type: string
          enum:
          - DRAFT
          - SENT
          example: SENT
          description: Lifecycle status of the Questionnaire. DRAFT is an agent-generated follow-up questionnaire that has been saved but not yet sent to the vendor.
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          example: '2025-07-01T16:45:55.246Z'
          description: Date when the Questionnaire was completed, null if not completed
        totalQuestions:
          type:
          - number
          - 'null'
          example: 10
          description: Total number of questions in the Questionnaire, null for DRAFT Questionnaires
        totalQuestionsAnswered:
          type:
          - number
          - 'null'
          example: 10
          description: Total number of questions answered, null for DRAFT Questionnaires
        reminderDate:
          type:
          - string
          - 'null'
          format: date-time
          example: '2025-07-01T16:45:55.246Z'
          description: Date the most recent reminder for this Questionnaire was sent, if any
      required:
      - id
      - completedBy
      - recipientEmail
      - isCompleted
      - dateSent
      - isManualUpload
      - responseId
      - status
      - completedAt
      - totalQuestions
      - totalQuestionsAnswered
      - reminderDate
