    SecurityReviewActionRequestPublicV2Dto:
      type: object
      properties:
        action:
          description: Action to perform on the security review.
          example: finalize
          allOf:
          - $ref: '#/components/schemas/SecurityReviewActionEnum'
        decision:
          example: APPROVED
          description: Finalization decision. Only valid when `action` is `finalize`. Must be one of APPROVED, APPROVED_WITH_CONDITIONS, or REJECTED. PENDING is intentionally not accepted; use the `reopen` action if the reviewer needs to return the review to in-progress. When omitted on `finalize`, defaults to APPROVED for backward compatibility.
          allOf:
          - $ref: '#/components/schemas/SecurityReviewFinalizeDecisionEnum'
        note:
          type: string
          maxLength: 1000
          description: Optional reviewer note captured with the finalization. Only valid when `action` is `finalize`.
        resetDecision:
          type: boolean
          example: true
          description: When true, reset the decision back to PENDING as part of the reopen. Only valid when `action` is `reopen`. Defaults to `false`, which preserves the prior decision on the reopened review.
