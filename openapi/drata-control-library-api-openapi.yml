          - PRIVACY_RELATED_TO_MONITORING_AND_ENFORCEMENT
          - DEFINITIONS
          - BREACH_NOTIFICATIONS
          - TECHNICAL
          - OPERATIONAL
          - MANAGEMENT
          description: Category classification of the Control Template.
        inUse:
          type: boolean
          example: true
          description: True when at least one Control derived from this Template exists in the caller account.
        testTemplates:
          description: Default Test Templates mapped to this Control. Only returned when `expand[]=testTemplates` is passed.
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryTestTemplateCompactResponsePublicV2Dto'
        policyTemplates:
          description: Default Policy Templates mapped to this Control. Only returned when `expand[]=policyTemplates` is passed.
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryPolicyTemplateCompactResponsePublicV2Dto'
        evidenceTemplates:
          description: Default Evidence Templates mapped to this Control. Only returned when `expand[]=evidenceTemplates` is passed.
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryEvidenceTemplateCompactResponsePublicV2Dto'
        requirementTemplates:
          description: Requirement Templates mapped to this Control, each with its parent Framework. Only returned when `expand[]=requirementTemplates` is passed.
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryRequirementTemplateCompactResponsePublicV2Dto'
