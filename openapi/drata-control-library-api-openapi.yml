    ControlLibraryDetailResponsePublicV2Dto:
      type: object
      properties:
        id:
          type: number
          example: 1042
          description: Unique identifier of the Control Template.
        code:
          type: string
          example: DCF-42
          description: Human-readable Control code.
        controlNumber:
          type: number
          example: 42
          description: Sequential Control number used for sorting and display.
        name:
          type: string
          example: Access Control Policy
          description: Display name of the Control Template.
        description:
          type:
          - string
          - 'null'
          example: Documented policy describing access controls...
          description: Description of the Control Template.
        question:
          type:
          - string
          - 'null'
          example: Does the company enforce documented access controls?
          description: Audit-prep question presented to the Control owner for this Control Template.
        activity:
          type:
          - string
          - 'null'
          example: Review and approve access requests at least quarterly.
          description: Recommended ongoing activity for personnel responsible for this Control.
        domain:
          type:
