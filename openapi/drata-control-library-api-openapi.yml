openapi: 3.2.0
info:
  title: Drata Control Library API
  version: V2
  contact: {}
  description: 'Operations tagged Control Library across 2 of this provider''s published API definitions: drata-api-v2-openapi.json, drata-api-v2-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://public-api.drata.com/public/v2
- url: https://public-api.eu.drata.com/public/v2
- url: https://public-api.apac.drata.com/public/v2
tags:
- name: Control Library
  description: The Control Library is a catalog of pre-built Control Templates that can be provisioned into a Workspace. Each item carries default mappings to Tests, Policies, Evidence, and Framework Requirements.
paths:
  /control-library:
    get:
      description: 'Returns a paginated list of Control Templates with optional field and relational filters.


        🔒 Requires **Controls: List Controls** permission.


        💎 Requires your account have the **Custom Frameworks** feature. Contact your CSM for help upgrading.'
      operationId: ControlLibraryPublicV2Controller_listControlLibrary
      parameters:
      - name: cursor
        required: false
        in: query
        description: This parameter is used to paginate through results. No value is needed for the first request. If there are additional results, the response will contain a `pagination.cursor` value that can be used in the subsequent request to retrieve the next page of results
        schema:
          type: string
      - name: size
        required: false
        in: query
        description: Number of results to return
        schema:
          minimum: 1
          maximum: 500
          default: 50
          type: number
      - name: sort
        required: false
        in: query
        description: Field to sort by.
        schema:
          $ref: '#/components/schemas/ControlLibrarySortEnum'
      - name: sortDir
        required: false
        in: query
        description: The direction to sort the data
        schema:
          $ref: '#/components/schemas/SortDirectionEnum'
      - name: includeTotalCount
        required: false
        in: query
        description: Include total count of all matching records in response. Only honored on first page (when cursor is null).
        schema:
          default: false
          example: false
          type: boolean
      - name: search
        required: false
        in: query
        description: Prefix search across Control name AND code. Matches Controls where either the name OR the code starts with the provided value.
        schema:
          example: DCF-
          type: string
      - name: codes[]
        required: false
        in: query
        description: Filter by **exact** Control codes (not prefix). Returns only Controls whose code matches one of the provided values. Use `search` for prefix matching.
        schema:
          example:
          - DCF-1
          - DCF-42
          type: array
          items:
            type: string
      - name: ids[]
        required: false
        in: query
        description: Filter by Control Template IDs. Returns only Controls whose ID matches one of the provided values.
        schema:
          example:
          - 1
          - 2
          - 3
          type: array
          items:
            type: number
      - name: excludeIds[]
        required: false
        in: query
        description: Exclude Control Templates with these IDs from the response.
        schema:
          example:
          - 99
          type: array
          items:
            type: number
      - name: domain
        required: false
        in: query
        description: Filter by Control Domain. Accepts the Domain name (e.g. `DATA_AND_PRIVACY`).
        schema:
          $ref: '#/components/schemas/ControlDomainEnum'
      - name: category
        required: false
        in: query
        description: Filter by Control Category. Accepts the Category name (e.g. `ACCESS_CONTROL`).
        schema:
          $ref: '#/components/schemas/ControlCategoryEnum'
      - name: frameworkTag
        required: false
        in: query
        description: Filter by Framework. Accepts the Framework Tag name (e.g. `SOC_2`, `ISO27001`, `HIPAA`). Returns Controls mapped to a Requirement on the given Framework.
        schema:
          $ref: '#/components/schemas/FrameworkTagEnum'
      - name: hasTests
        required: false
        in: query
        description: When true, returns only Controls with at least one default Test mapping.
        schema:
          type: boolean
      - name: hasPolicies
        required: false
        in: query
        description: When true, returns only Controls with at least one default Policy mapping.
        schema:
          type: boolean
      - name: hasEvidence
        required: false
        in: query
        description: When true, returns only Controls with at least one default Evidence mapping.
        schema:
          type: boolean
      - name: hasRisks
        required: false
        in: query
        description: When true, returns only Controls mapped to at least one Risk in the Risk Library.
        schema:
          type: boolean
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLibraryResponsePublicV2Dto'
        '400':
          description: Malformed data and/or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponsePublicV2Dto'
        '401':
          description: Invalid Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '402':
          description: You must upgrade your plan to use this feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '403':
          description: You are not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '412':
          description: You must accept the Drata terms and conditions to use the API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
      security:
      - bearer: []
      summary: List Control Library
      tags:
      - Control Library
      x-drata-entitlement:
      - CUSTOM_FRAMEWORKS
      x-drata-permissions:
      - controls-get
      x-product-area:
      - CONTROL_LIBRARY
    servers:
    - url: https://public-api.drata.com/public/v2
    - url: https://public-api.eu.drata.com/public/v2
    - url: https://public-api.apac.drata.com/public/v2
  /control-library/{templateId}:
    get:
      description: 'Returns a single Control Template by id with optional expand-gated relations.


        🔒 Requires **Controls: List Controls** permission.


        💎 Requires your account have the **Custom Frameworks** feature. Contact your CSM for help upgrading.'
      operationId: ControlLibraryPublicV2Controller_getControlLibraryItem
      parameters:
      - name: templateId
        required: true
        in: path
        schema:
          type: number
      - name: expand[]
        required: false
        in: query
        description: List of subcollections and sub-objects to expand.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryDetailExpandEnum'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLibraryDetailResponsePublicV2Dto'
        '400':
          description: Malformed data and/or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponsePublicV2Dto'
        '401':
          description: Invalid Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '402':
          description: You must upgrade your plan to use this feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '403':
          description: You are not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponsePublicV2Dto'
        '412':
          description: You must accept the Drata terms and conditions to use the API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
      security:
      - bearer: []
      summary: Get Control Library Item
      tags:
      - Control Library
      x-drata-entitlement:
      - CUSTOM_FRAMEWORKS
      x-drata-permissions:
      - controls-get
      x-product-area:
      - CONTROL_LIBRARY
    servers:
    - url: https://public-api.drata.com/public/v2
    - url: https://public-api.eu.drata.com/public/v2
    - url: https://public-api.apac.drata.com/public/v2
  /control-library/action-import:
    post:
      description: 'Provisions one or more tenant Controls from Control Library templates. All-or-nothing semantics: any invalid spec rejects the whole request with no writes. Each provisioned Control includes the template default mappings (tests, policies, evidence, requirements).


        🔒 Requires **Controls: Create Control** permission.


        💎 Requires your account have the **Custom Frameworks** feature. Contact your CSM for help upgrading.'
      operationId: ControlLibraryPublicV2Controller_importControlLibrary
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlLibraryImportRequestPublicV2Dto'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLibraryImportResponsePublicV2Dto'
        '400':
          description: Malformed data and/or validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlLibraryImportErrorResponsePublicV2Dto'
        '401':
          description: Invalid Authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '402':
          description: You must upgrade your plan to use this feature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '403':
          description: You are not allowed to perform this action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '412':
          description: You must accept the Drata terms and conditions to use the API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponseDto'
      security:
      - bearer: []
      summary: Import Control Library Controls
      tags:
      - Control Library
      x-drata-entitlement:
      - CUSTOM_FRAMEWORKS
      x-drata-permissions:
      - controls-post
      x-product-area:
      - CONTROL_LIBRARY
    servers:
    - url: https://public-api.drata.com/public/v2
    - url: https://public-api.eu.drata.com/public/v2
    - url: https://public-api.apac.drata.com/public/v2
