    ControlLibraryImportOutcomeResponsePublicV2Dto:
      type: object
      properties:
        inputIndex:
          type: number
          description: Index of the corresponding input in the request's `data` array. Use to correlate outcomes back to inputs.
        templateIdentifier:
          oneOf:
          - type: number
          - type: string
          description: Template identifier echoed from the input (id or code).
        workspaceId:
          type: number
          description: Workspace the input targeted.
        controlId:
          type: number
          description: Resulting tenant Control id. Present for `created` and `skipped` (echoes the existing control); absent for `failed`.
        code:
          type: string
          example: DCF-042
          description: Resulting tenant Control code. For `created` outputs this is the code persisted on the new row, which may carry a duplicate-suffix (e.g. `DCF-042.1`) when `allowDuplicates` was set. For `skipped` outputs this echoes the existing control. Absent for `failed`.
        status:
          type: string
          enum:
          - created
          - skipped
          - failed
          description: '`created`: new control provisioned. `skipped`: template already present in workspace and `allowDuplicates` was false (echoes the existing controlId). `failed`: input couldn''t be provisioned — see `failureReason`.'
        failureReason:
          type: string
          description: Human-readable reason this input failed. Present only when `status` is `failed`.
        associations:
          description: Per-association-type outcome buckets. Each bucket reports the entities `created`, those now `mapped` to this control (whether newly created or pre-existing), and any per-entity `failures`.
          allOf:
          - $ref: '#/components/schemas/ControlLibraryImportAssociationsResponsePublicV2Dto'
        customFields:
          description: Custom Field values written onto the newly provisioned Control. Echoes the post-submission state — same shape returned by the Control GET endpoints. Present only when the input supplied `customFields` and `status` is `created`.
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldResponsePublicV2Dto'
      required:
      - inputIndex
      - templateIdentifier
      - workspaceId
      - status
      - associations
    ControlAssociationFailurePublicV2Dto:
      type: object
      properties:
        identifier:
          oneOf:
          - type: number
          - type: string
          description: Identifier of the entity that failed (id or code).
        reason:
          type: string
          description: Human-readable reason this entity failed. Prefixed with `Creation failed:` or `Mapping failed:` to indicate which phase encountered the error.
      required:
      - identifier
      - reason
    ControlLibraryImportResponsePublicV2Dto:
      type: object
      properties:
        data:
          description: Per-input outcomes in the same order as the request `data` array. Each outcome reports status, resulting controlId, and per-association-type provisioning buckets.
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryImportOutcomeResponsePublicV2Dto'
      required:
      - data
    ControlLibraryResponsePublicV2Dto:
      type: object
      properties:
        data:
          description: Data set based on the pagination limits
          type: array
          items:
            $ref: '#/components/schemas/ControlLibraryItemResponsePublicV2Dto'
        pagination:
          $ref: '#/components/schemas/PaginationTotalCountResponsePublicV2Dto'
      required:
      - data
      - pagination
    ControlLibraryImportInputPublicV2Dto:
      type: object
      properties:
        workspaceId:
          type: number
          example: 100
          description: The workspace where the Control will be provisioned.
        templateId:
          type: number
          example: 1042
          description: The Control Library template id to provision from.
        name:
          type: string
          maxLength: 191
          example: Quarterly User Access Reviews
          description: Override the name on the provisioned Control. Defaults to the template name.
        description:
          type: string
          maxLength: 30000
          example: Access to critical systems is reviewed on a quarterly basis to ensure that only authorized users retain access.
          description: Override the description on the provisioned Control. Defaults to the template description.
        question:
          type: string
          maxLength: 768
          example: Is the access review performed on a quarterly basis?
          description: Override the question on the provisioned Control. Defaults to the template question.
        activity:
          type: string
          maxLength: 768
          example: On a quarterly schedule, generate access reports from identity providers.
          description: Override the activity on the provisioned Control. Defaults to the template activity.
        customFields:
          description: Custom Field submissions to apply to the provisioned Control. Each entry must reference the Custom Field by `id` or `name` and provide a `value`. Any Custom Field marked as required must be present; invalid or missing required fields cause the entire import to be rejected.
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldSubmitRequestPublicV2Dto'
      required:
      - workspaceId
      - templateId
    ControlLibraryDetailExpandEnum:
      type: string
      enum:
      - testTemplates
      - policyTemplates
      - evidenceTemplates
      - requirementTemplates
      - controlsUsingTemplate
    SortDirectionEnum:
      type: string
      enum:
