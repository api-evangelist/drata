versioning:
  scheme: path
  current_version: v2
  path_segment: /public/v2
  spec_declared_version: V2
  previous_versions: [v1]
  policy_published: false
  note: >-
    Drata versions the API in the URL path and documents the V1 -> V2 differences inside the
    OpenAPI description, but publishes no written versioning policy, no support window for V1,
    and no sunset date.

deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    Zero of the 197 operations carry the OpenAPI `deprecated` flag, and the spec declares no
    Sunset or Deprecation response headers. Drata does mark unstable operations with a 🧪
    test-tube emoji in the operation summary (Delete HRIS User Identity 🧪, Remove Personnel
    Group From Workspace Scope 🧪, and others) — a real beta marker, but a prose one that no
    tooling reads, and the opposite end of the lifecycle from deprecation.
  gap: >-
    An agent has no machine-readable warning before an operation changes or disappears. This is
    the single clearest lifecycle gap on this API.

beta_program:
  marker: 🧪 emoji suffix on the operation summary
  machine_readable: false
  mcp_status: >-
    The Drata MCP Server is itself labelled Beta / early access and is gated behind a request
    form; the SafeBase MCP Server entered Early Access on 2026-07-31.

