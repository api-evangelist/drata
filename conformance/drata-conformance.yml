description: >-
  Cross-cutting and domain standards the Drata contracts actually declare, each with evidence
  pointing at the exact spec or metadata location. Reward-only: an absent standard is recorded
  as conforms:false with the reason, never inflated.

standards:
- id: openapi
  name: OpenAPI Specification
  version: 3.0.0 (Public API v2), 3.1.0 (SafeBase Trust API)
  conforms: true
  evidence: >-
    openapi/drata-api-v2-openapi.yml declares openapi 3.0.0 with 132 paths / 197 operations /
    520 schemas; openapi/drata-safebase-trust-api-openapi.yml declares openapi 3.1.0 with 29
    paths / 41 operations. Both parse.

- id: oauth2
  name: OAuth 2.0 / 2.1
  conforms: true
  scope: MCP server only
  evidence: >-
    https://mcp.drata.com/.well-known/oauth-authorization-server returns RFC 8414
    authorization-server metadata (issuer https://drata-prod.us.auth0.com/, PKCE S256,
    authorization_code + refresh_token + client_credentials + device_code grants).
    The Public API v2 itself does NOT use OAuth — it uses bearer API keys.

- id: rfc9728
  name: OAuth 2.0 Protected Resource Metadata
  conforms: true
  evidence: >-
    https://mcp.drata.com/.well-known/oauth-protected-resource returns a conformant document
    with resource, authorization_servers[], scopes_supported[] (33 scopes) and
    bearer_methods_supported ["header"]. This is what makes the MCP server discoverable to an
    agent with no prior configuration.

- id: rfc8414
  name: OAuth 2.0 Authorization Server Metadata
  conforms: true
  evidence: https://mcp.drata.com/.well-known/oauth-authorization-server, HTTP 200.

- id: oidc
  name: OpenID Connect Discovery
  conforms: true
  scope: MCP authorization only
  evidence: >-
    https://mcp.drata.com/.well-known/openid-configuration, HTTP 200, issuer
    https://drata-prod.us.auth0.com/, jwks_uri present, openid/profile/email scopes supported.

- id: rfc7591
  name: OAuth 2.0 Dynamic Client Registration
  conforms: true
  evidence: registration_endpoint https://drata-prod.us.auth0.com/oidc/register in the authorization-server metadata.

- id: mcp
  name: Model Context Protocol
  conforms: true
  transport: streamable HTTP
  evidence: >-
    https://mcp.drata.com/mcp/ answers a JSON-RPC tools/list POST with HTTP 401 and
    www-authenticate Bearer realm="drata-mcp" — an authenticated MCP endpoint, discoverable
    via RFC 9728. Tool schemas are auth-gated and were not introspected.

- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No application/problem+json media type and no type/title/detail/instance members anywhere
    in either spec. Errors use a vendor envelope {name, statusCode, message, code, debugInfo}.

- id: idempotency
  name: Idempotency keys (draft-ietf-httpapi-idempotency-key-header)
  conforms: false
  evidence: Zero /idempoten/i tokens in either OpenAPI document or in the help-centre API article.

- id: rfc8594
  name: Sunset HTTP Header
  conforms: false
  evidence: No Sunset or Deprecation header declared; zero operations flagged `deprecated`.

- id: pagination
  name: Cursor pagination
  conforms: true
  evidence: >-
    `cursor`, `size`, `sort`, `sortDir` query parameters on 62 list operations;
    `includeTotalCount` on 53; the response carries pagination.cursor and the spec description
    publishes a worked fetchAll() loop.

- id: rate-limit-headers
  name: RateLimit header fields for HTTP (RFC 9239 draft)
  conforms: false
  evidence: >-
    Drata documents a 500 req/min per-source-IP limit and a Retry-After on 429, but declares no
