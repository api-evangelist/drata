- id: scim
  name: SCIM 2.0
  conforms: false
  evidence: >-
    No urn:ietf:params:scim:schemas:* URN and no /Users or /Groups SCIM endpoints in the public
    contract. Drata operates HRIS User Identity and Users-and-Roles surfaces with its own shapes.

- id: odata
  name: OData
  conforms: false
  evidence: No $metadata surface and no OData query options in either contract.

- id: json-schema
  name: JSON Schema
  conforms: true
  scope: Custom Connections
  evidence: >-
    The Custom Connections recipe requires callers to supply a JSON Schema for CUSTOM provider
    records via the `schema` field (or to have Drata infer one from `sampleData`). Consumer-
    authored schemas travel through the API as first-class data.
  source: https://developers.drata.com/developer-portal/v2/recipes/custom-connections/

domain_standards:
  market: GRC / security compliance automation
  note: >-
    Drata's market has audit and control FRAMEWORKS rather than a wire-format interchange
    standard, and Drata models those frameworks as first-class API resources — but as its own
    shapes, not as a published exchange format. There is no OSCAL, no SCAP/OpenControl, and no
    common-controls interchange in the contract. Recorded as absent, not penalised.
  entries:
  - id: oscal
    name: NIST OSCAL (Open Security Controls Assessment Language)
    conforms: false
    evidence: >-
      No OSCAL catalog/profile/component-definition/assessment-plan media types, schemas or
      endpoints in the 520-schema contract. Drata exposes Frameworks (9 ops), Controls (8),
      Control Library (3) and Evidence (10) through proprietary DTOs. OSCAL is the closest
      thing this market has to an interchange standard, and consuming a Drata control set into
      an OSCAL-speaking tool requires a bespoke connector.
  - id: fedramp
    name: FedRAMP / FedRAMP 20x
    conforms: partial
    kind: programme participation, not a wire format
    evidence: >-
      Drata maintains a public github.com/drata/fedramp-20x repository and publishes FedRAMP
      20x material on its blog. This is programme participation and framework support inside
      the product; it is not a machine-readable conformance of the API contract.

compliance_certifications:
  source: https://trust.drata.com/
  artifact: security/drata-trust-center.yml
  certifications: [SOC 2, ISO 27001, ISO 27017, ISO 27018, HIPAA, GDPR, CSA STAR]
  note: >-
    Drata is itself certified against the frameworks its product automates; the trust centre is
    a SafeBase trust centre, i.e. Drata's own acquired product.

regional_data_residency:
  regions: [US, EU, APAC]
  evidence: >-
    Three declared servers in the spec (public-api.drata.com, public-api.eu.drata.com,
    public-api.apac.drata.com), three regional MCP endpoints, and region-split components on
    the status page. Data residency is a contract-level fact here, not just a marketing claim.

