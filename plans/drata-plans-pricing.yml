description: Drata publishes no pricing tiers. https://drata.com/pricing is a product/benefits page whose only calls
  to action are "Get Started", "Contact Sales" and "Get a Demo" — no named plan, no price, no included quota, no
  overage schedule. Pricing is quote-based and scoped by framework selection, headcount and integration count. plan_count
  is 0 because zero plans are published, not because none were looked for.
notes: API access is included with a paid Drata subscription; there is no separate API plan, no metered API pricing
  and no self-serve tier. The Drata MCP server is a gated beta requiring a request form, and some API operations
  return HTTP 402 "You must upgrade your plan to use this feature" (37 operations) or "The required account entitlement
  is not enabled" — so entitlement IS enforced at the contract level even though the plan matrix behind it is not
  published.
