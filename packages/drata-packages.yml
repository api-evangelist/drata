description: >-
  Client-library situation for the Drata Public API v2. Drata ships NO working first-party SDK
  in any language. It owns registry namespaces and SDK repositories, but every one of them is
  an empty placeholder — which is a different and worse fact than having no SDK at all,
  because a developer who finds `drata/sdk-go` or `drata/sdk-php` reasonably expects code.
