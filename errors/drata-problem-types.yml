rfc9457: false
note: Drata does not emit application/problem+json and declares no RFC 9457 problem types. Every error is the same vendor
  envelope, ExceptionResponsePublicV2Dto. The `code` field is a NUMERIC Drata-internal error code that is distinct from the
  HTTP statusCode (an unauthenticated GET of https://public-api.drata.com/openapi.json returns {"statusCode":401,"message":"Unauthorized","code":12300});
  Drata does not publish a registry of those numeric codes, so they cannot be enumerated here without fabricating them.
envelope:
  schema: ExceptionResponsePublicV2Dto
  media_type: application/json
  fields:
  - name: name
    type: string
    required: true
    description: Exception class name.
  - name: statusCode
    type: number
    required: true
    description: HTTP status code, repeated in the body.
  - name: message
    type: string
    required: true
    description: Human-readable failure description.
  - name: code
    type: number
    required: true
    description: Drata-internal numeric error code. Not the HTTP status. No public registry.
  - name: debugInfo
    type: object
    required: false
    description: Optional {name, message, stack} debug block.
  legacy_variants:
  - ExceptionResponsePublicDto
  - ExceptionResponseDto
  note: The v1/legacy variants are identical minus the top-level `name` field.
observed_examples:
- url: https://public-api.drata.com/openapi.json
  status: 401
  body: '{"statusCode":401,"message":"Unauthorized","code":12300}'
- url: https://public-api.drata.com/public/v2/openapi.json
  status: 401
  body: '{"statusCode":401,"message":"Unauthorized","code":26430,"debugInfo":null}'
- url: https://mcp.drata.com/mcp/
  status: 401
  body: '{"error": "unauthorized", "message": "Bearer token required. Use OAuth to authenticate."}'
  note: The MCP gateway uses a DIFFERENT error envelope from the REST API — {error, message}, not {name, statusCode, message,
    code}. An agent handling both surfaces must parse two shapes.
